# GemmaNet production stack: docker compose up -d --build
# Configure through .env (copy .env.example). See deploy/DEPLOY.md.
name: gemmanet

# Every service: no capabilities, no privilege gain, read-only root file
# system, a non-root user, size-capped logs (20 MB x 3; the privacy policy
# relies on it). CI checks this on the running stack. Keys that a host-local
# docker-compose.override.yml may set (cgroup_parent, mem_limit, pids_limit)
# are deliberately left out.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  postgres:
    <<: *hardening
    image: postgres:16
    # Started as the image's own user, the entrypoint needs no capabilities
    # (it only chowns and switches user when started as root).
    user: postgres
    tmpfs: [/var/run/postgresql, /tmp]
    restart: unless-stopped
    environment:
      POSTGRES_USER: gemmanet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gemmanet
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemmanet -d gemmanet"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *hardening
    image: redis:7
    user: redis
    tmpfs: [/tmp]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  coordinator:
    <<: *hardening
    build:
      context: .
      target: app
    image: gemmanet-app
    tmpfs: [/tmp]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gemmanet:${POSTGRES_PASSWORD}@postgres:5432/gemmanet
      REDIS_URL: redis://redis:6379/0
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env}
      COORDINATOR_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      GEMMANET_SITE_URL: ${SITE_URL:-/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - coordinator-data:/data
    # Not published on the host: only Caddy talks to it.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/api/v1/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  caddy:
    <<: *hardening
    build:
      context: .
      target: web
    image: gemmanet-web
    # Runs as uid/gid 10002 (see Dockerfile): deploy/certs must be readable by
    # it, e.g. sudo chgrp 10002 deploy/certs/* && sudo chmod 640 deploy/certs/*
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    # Certificates come from files, so Caddy's storage needs no persistence.
    tmpfs: ["/data:uid=10002,gid=10002,mode=0700", "/config:uid=10002,gid=10002,mode=0700"]
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:?set SITE_ADDRESSES in .env}
      API_HOST: ${API_HOST:-api.invalid}
      TLS_MODE: ${TLS_MODE:-origin}
    volumes:
      - ./deploy/certs:/certs:ro

  # Seed nodes: docker compose --profile seeds up -d  (needs GEMMANET_API_KEY)
  seed-chat: &seed
    <<: *hardening
    image: gemmanet-app
    tmpfs: [/tmp]
    profiles: ["seeds"]
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      GEMMANET_API_KEY: ${GEMMANET_API_KEY:-}
      GEMMANET_COORDINATOR: ws://coordinator:8800/ws/node
    command: ["python", "seeds/chat_seed.py"]
  seed-echo:
    <<: *seed
    command: ["python", "seeds/echo_seed.py"]
  seed-translate:
    <<: *seed
    command: ["python", "seeds/translate_seed.py"]

volumes:
  postgres-data:
  redis-data:
  coordinator-data:
