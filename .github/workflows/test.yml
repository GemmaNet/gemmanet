name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gemmanet
          POSTGRES_PASSWORD: gemmanet
          POSTGRES_DB: gemmanet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gemmanet:gemmanet@localhost:5432/gemmanet_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      E2E_REDIS_URL: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Run tests
        run: pytest tests/ -v

  deploy-smoke:
    # Builds the production Docker stack and runs the post-deploy smoke check
    # against it, exactly as deploy/DEPLOY.md does on the server.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cloudflare ranges in the Caddyfile are current
        run: |
          pip install httpx
          python scripts/check_cloudflare_ips.py deploy/Caddyfile.docker

      - name: Start the stack
        run: |
          cat > .env <<'EOF'
          PUBLIC_URL=http://localhost
          SITE_ADDRESSES=http://localhost, http://api.localhost
          API_HOST=api.localhost
          TLS_MODE=none
          POSTGRES_PASSWORD=ci-password
          ADMIN_KEY=ci-admin
          EOF
          docker compose up -d --build --wait

      - name: Smoke check
        run: |
          docker run --rm --network host --add-host api.localhost:127.0.0.1 gemmanet-app \
            python scripts/smoke_check.py --base http://localhost --api-base http://api.localhost \
            --register --admin-key ci-admin \
            --version "$(grep -oP "__version__ = '\\K[^']+" src/gemmanet/__init__.py)"

      - name: Smoke check with the site built for Cloudflare Pages
        run: |
          pip install -r docs/requirements.txt
          GEMMANET_API_ORIGIN=http://api.localhost python scripts/build_pages.py
          python -m http.server 8099 --directory pages-dist >/dev/null 2>&1 &
          sleep 1
          # http.server ignores _redirects (unit-tested instead)
          docker run --rm --network host --add-host api.localhost:127.0.0.1 gemmanet-app \
            python scripts/smoke_check.py --base http://localhost:8099 --api-base http://api.localhost \
            --register --no-redirect-check

      - name: Seed nodes come online
        run: |
          KEY=$(curl -sf -X POST http://localhost/api/v1/register | python -c 'import sys, json; print(json.load(sys.stdin)["api_key"])')
          echo "GEMMANET_API_KEY=$KEY" >> .env
          docker compose --profile seeds up -d --wait
          for i in $(seq 1 30); do
            n=$(curl -s http://localhost/api/v1/nodes | python -c 'import sys, json; print(len(json.load(sys.stdin)))')
            [ "$n" -ge 3 ] && break
            sleep 1
          done
          echo "online nodes: $n"
          test "$n" -ge 3

      - name: TLS_MODE=origin-mtls admits only the AOP client certificate
        run: |
          # Throwaway certificates: origin (server), the AOP CA and a client
          # certificate it signed (stands in for Cloudflare), and a client
          # certificate from another CA.
          d=$(mktemp -d)
          gen() { openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$1" -keyout $d/$1.key -out $d/$1.pem "${@:2}" 2>/dev/null; }
          gen origin -addext subjectAltName=DNS:api.localhost
          gen aop-ca
          gen rogue-ca
          gen aop-client -CA $d/aop-ca.pem -CAkey $d/aop-ca.key -addext extendedKeyUsage=clientAuth
          gen rogue-client -CA $d/rogue-ca.pem -CAkey $d/rogue-ca.key -addext extendedKeyUsage=clientAuth
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q coordinator)")
          docker run -d --name mtls-caddy --network "$net" -p 8443:443 \
            -e SITE_ADDRESSES=api.localhost -e API_HOST=api.localhost -e TLS_MODE=origin-mtls \
            -v "$d:/certs:ro" gemmanet-web
          fetch() { curl -s -o /dev/null -w '%{http_code}' --resolve api.localhost:8443:127.0.0.1 \
            --cacert $d/origin.pem "$@" https://api.localhost:8443/api/v1/status || true; }
          for i in $(seq 1 30); do [ "$(fetch --cert $d/aop-client.pem --key $d/aop-client.key)" = 200 ] && break; sleep 1; done
          valid=$(fetch --cert $d/aop-client.pem --key $d/aop-client.key)
          none=$(fetch)
          rogue=$(fetch --cert $d/rogue-client.pem --key $d/rogue-client.key)
          # Straight to the IP without SNI, as a scanner would
          nosni=$(curl -s -o /dev/null -w '%{http_code}' -k -H 'Host: api.localhost' https://127.0.0.1:8443/api/v1/status || true)
          echo "AOP client cert: $valid | no cert: $none | other CA: $rogue | no SNI: $nosni"
          docker logs mtls-caddy 2>&1 | tail -5
          docker rm -f mtls-caddy
          test "$valid" = 200 && test "$none" = 000 && test "$rogue" = 000 && test "$nosni" != 200

      - name: Logs
        if: failure()
        run: docker compose --profile seeds logs

      - name: Tear down
        if: always()
        run: docker compose --profile seeds down -v
