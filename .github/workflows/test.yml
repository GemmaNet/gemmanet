name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gemmanet
          POSTGRES_PASSWORD: gemmanet
          POSTGRES_DB: gemmanet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gemmanet:gemmanet@localhost:5432/gemmanet_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      E2E_REDIS_URL: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Run tests
        run: pytest tests/ -v

  deploy-smoke:
    # Builds the production Docker stack and runs the post-deploy smoke check
    # against it, exactly as deploy/DEPLOY.md does on the server.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cloudflare ranges in the Caddyfile are current
        run: |
          pip install httpx
          python scripts/check_cloudflare_ips.py deploy/Caddyfile.docker

      - name: Start the stack
        run: |
          cat > .env <<'EOF'
          PUBLIC_URL=http://localhost
          SITE_ADDRESSES=http://localhost, http://api.localhost
          API_HOST=api.localhost
          TLS_MODE=none
          POSTGRES_PASSWORD=ci-password
          ADMIN_KEY=ci-admin
          EOF
          docker compose up -d --build --wait

      - name: Smoke check
        run: |
          docker run --rm --network host --add-host api.localhost:127.0.0.1 gemmanet-app \
            python scripts/smoke_check.py --base http://localhost --api-base http://api.localhost \
            --register --admin-key ci-admin \
            --version "$(grep -oP "__version__ = '\\K[^']+" src/gemmanet/__init__.py)"

      - name: Smoke check with the site built for Cloudflare Pages
        run: |
          pip install -r docs/requirements.txt
          GEMMANET_API_ORIGIN=http://api.localhost python scripts/build_pages.py
          python -m http.server 8099 --directory pages-dist >/dev/null 2>&1 &
          sleep 1
          # http.server ignores _redirects (unit-tested instead)
          docker run --rm --network host --add-host api.localhost:127.0.0.1 gemmanet-app \
            python scripts/smoke_check.py --base http://localhost:8099 --api-base http://api.localhost \
            --register --no-redirect-check

      - name: Seed nodes come online
        run: |
          KEY=$(curl -sf -X POST http://localhost/api/v1/register | python -c 'import sys, json; print(json.load(sys.stdin)["api_key"])')
          echo "GEMMANET_API_KEY=$KEY" >> .env
          docker compose --profile seeds up -d --wait
          for i in $(seq 1 30); do
            n=$(curl -s http://localhost/api/v1/nodes | python -c 'import sys, json; print(len(json.load(sys.stdin)))')
            [ "$n" -ge 3 ] && break
            sleep 1
          done
          echo "online nodes: $n"
          test "$n" -ge 3

      - name: Logs
        if: failure()
        run: docker compose --profile seeds logs

      - name: Tear down
        if: always()
        run: docker compose --profile seeds down -v
